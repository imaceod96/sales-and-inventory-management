[package]
name = "establecimiento-comercial-desktop"
version = "1.0.0"
description = "Aplicación comercial 100% offline con React y Tauri 2"
authors = ["Establecimiento Comercial"]
edition = "2021"

[lib]
name = "establecimiento_comercial_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
